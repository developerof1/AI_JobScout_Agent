name: Daily Job Scout

on:
  # Paused as part of the Contracting/Scouting architecture merge — see
  # docs/architecture.html "Migration plan" step 6. workflow_dispatch stays
  # so Scouting can still be run manually; re-enable this schedule to resume
  # the 4x-daily cron.
  # schedule:
  #   # 8 AM EST  (13:00 UTC)
  #   - cron: "0 13 * * *"
  #   # 1 PM EST  (18:00 UTC)
  #   - cron: "0 18 * * *"
  #   # 5 PM EST  (22:00 UTC, weekdays only)
  #   - cron: "0 22 * * 1-5"
  #   # 9 PM EST  (02:00 UTC next day)
  #   - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_number:
        description: "Run number override (1-4)"
        required: false
        default: "1"

jobs:
  determine_run_number:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.run_number.outputs.number }}
    steps:
      - name: Determine run number
        id: run_number
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.run_number }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if   [ "$HOUR" -eq 13 ]; then echo "number=1" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" -eq 18 ]; then echo "number=2" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" -eq 22 ]; then echo "number=3" >> "$GITHUB_OUTPUT"
            else                          echo "number=4" >> "$GITHUB_OUTPUT"
            fi
          fi

  scout:
    needs: determine_run_number
    uses: ./.github/workflows/_tab_scout_template.yml
    with:
      tab: scouting
      run-number: ${{ needs.determine_run_number.outputs.number }}
      scoring-enabled: true
      output-paths: data/scouting_jobs.json data/applied_jobs.json
      commit-message: "chore: update scouting_jobs.json [run ${{ needs.determine_run_number.outputs.number }}] [skip ci]"
      deploy-commit-message: "deploy: dashboard update [run ${{ needs.determine_run_number.outputs.number }}]"
    secrets: inherit
