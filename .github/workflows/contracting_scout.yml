name: Contracting Job Scout

on:
  schedule:
    # 8 AM CST (14:00 UTC) daily
    - cron: "0 14 * * *"
    # 5 PM CST (23:00 UTC) daily
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape contracting firms
        run: python scrapers/contracting_scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contracting_jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contracting_jobs.json [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Copy data to dashboard
        run: cp -r data dashboard/

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
          commit_message: "deploy: dashboard update (contracting)"
