name: Contracting Job Scout

on:
  schedule:
    # 8 AM CST (14:00 UTC) daily
    - cron: "0 14 * * *"
    # 5 PM CST (23:00 UTC) daily
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  scout:
    uses: ./.github/workflows/_tab_scout_template.yml
    with:
      tab: contracting
      scoring-enabled: false
      output-paths: data/contracting_jobs.json
      commit-message: "chore: update contracting_jobs.json [skip ci]"
      deploy-commit-message: "deploy: dashboard update (contracting)"
    secrets: inherit
