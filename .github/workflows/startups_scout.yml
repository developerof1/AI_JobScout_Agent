name: Startups Job Scout

on:
  schedule:
    # 8 AM CST (14:00 UTC) daily
    - cron: "0 14 * * *"
    # 5 PM CST (23:00 UTC) daily
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  scout:
    permissions:
      contents: write
    uses: ./.github/workflows/_tab_scout_template.yml
    with:
      tab: startups
      scoring-enabled: false
      output-paths: data/startups_jobs.json
      commit-message: "chore: update startups_jobs.json [skip ci]"
      deploy-commit-message: "deploy: dashboard update (startups)"
    secrets: inherit
